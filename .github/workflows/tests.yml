name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python main.py --check
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Linux tests including menu
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --junitxml=test-results.xml
      - name: Install native media bridge
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-media.txt
      - name: Windows portable tests
        if: runner.os == 'Windows'
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Report failing test details
        if: always()
        run: python tools/ci_test_report.py test-results.xml
