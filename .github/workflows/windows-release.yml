name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '**/*.py'
      - 'requirements*.txt'
      - 'build-exe.bat'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU speech runtime
        run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements-windows.txt -r requirements-voice.txt -r requirements-build.txt -r requirements-dev.txt
      - name: Check sources
        run: python -m ruff check .
      - name: Check command catalog
        run: python main.py --check
      - name: Check native libraries and background UI Automation before packaging
        run: python -c "import runpy, sys; runpy.run_path('packaging/build_windows.py')['run_checked']([sys.executable, 'main.py', '--release-import-check'], timeout=90)"
      - name: Package EXE and check the packaged runtime
        run: python packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Krest-Windows-EXE
          path: dist/Krest-Windows-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Krest-packaging-diagnostics
          path: |
            build/pyinstaller/krest/warn-*.txt
            build/pyinstaller/krest/xref-*.html
