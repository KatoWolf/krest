name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '**/*.py'
      - 'requirements*.txt'
      - 'build-exe.bat'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build through the user's launcher and check the packaged runtime
        shell: cmd
        run: call build-exe.bat
      - name: Check reuse of the prepared builder
        shell: cmd
        run: call build-exe.bat --plan
      - uses: actions/upload-artifact@v4
        with:
          name: Krest-Windows-EXE
          path: dist/Krest-Windows-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Krest-packaging-diagnostics
          path: |
            build/pyinstaller/krest/warn-*.txt
            build/pyinstaller/krest/xref-*.html
            build/build-last.log
            build/build-previous.log
