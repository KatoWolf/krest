name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - name: Check Telegram authorization import from a GUI worker
        run: python -c "from release_smoke import check_telegram_worker; check_telegram_worker()"
      - name: Validate Windows launcher scripts
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call packaging\find_python.bat
          if errorlevel 1 exit /b 1
          "%KREST_PYTHON%" %KREST_PY_ARGS% -c "import sys; assert sys.version_info[:2] in ((3,11),(3,12))"
      - name: Parse Windows update launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'packaging/update_source.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - run: python main.py --check
      - name: Check build failure recovery and logs
        run: python packaging/check_builder.py
      - name: Run an isolated child kernel and a real command
        shell: bash
        run: python -c "import runpy; runpy.run_path('packaging/build_windows.py')['source_smoke']()"
