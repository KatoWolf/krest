name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python main.py --check
      - name: Run an isolated child kernel and a real command
        shell: bash
        run: python -c "import tempfile, subprocess, sys; from pathlib import Path; d=tempfile.TemporaryDirectory(); subprocess.run([sys.executable, 'main.py', '--release-smoke', '--config', str(Path(d.name)/'config.json')], check=True, timeout=120); d.cleanup()"
